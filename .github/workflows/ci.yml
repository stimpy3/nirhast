name: CI
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build the Docker image (no keys)
        run: docker build -t nirhast .
      - name: Start the container and check it serves
        run: |
          docker run -d -p 8080:8080 --name nirhast nirhast
          sleep 3
          curl -sf http://localhost:8080/api/config
          curl -sf http://localhost:8080/ > /dev/null
