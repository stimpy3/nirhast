# One command:  docker compose up --build   ->  http://localhost:8080
# No keys needed. Optional keys are read from a local .env file (see .env.example); it is never copied into the image.
services:
  nirhast:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - nirhast-data:/app/data   # the kitchen's database survives restarts
    environment:
      - WISPR_API_KEY=${WISPR_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - GROQ_COOK_MODEL=${GROQ_COOK_MODEL:-}
      - GROQ_CHAT_MODEL=${GROQ_CHAT_MODEL:-}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-}
      - SARVAM_MODEL=${SARVAM_MODEL:-}
      - SARVAM_SPEAKER=${SARVAM_SPEAKER:-}
      - TRANSLATE_BEFORE_SORT=${TRANSLATE_BEFORE_SORT:-}
      - SAMPLE_HISTORY=${SAMPLE_HISTORY:-}
volumes:
  nirhast-data:
